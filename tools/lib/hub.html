<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dlm hub</title>
<style>
/* dlm hub:這台電腦所有 dlm 專案的總覽。資料來自 /api/v1/overview(每幾秒)與 /api/v1/events/stream(即時)。不連任何外部資源。 */
:root{
  --bg:#121216; --s1:#1a1a1f; --s2:#202026; --s3:#27272e; --s4:#30303a;
  --text:#e6e3ec; --dim:#a8a4b2; --faint:#76727f;
  --orch:#ffce86; --work:#7fd4ec; --you:#cdb4ff;
  --pass:#8ee0aa; --fail:#ffb2bb; --gate:#ffd98a;
  --sans:'Outfit','Noto Sans TC','PingFang TC',system-ui,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  --r-xl:22px; --r-lg:16px; --r-pill:999px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55;
  background-image:radial-gradient(1100px 520px at 78% -15%,rgba(127,212,236,.06),transparent 60%);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--work);outline-offset:2px;border-radius:6px}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;background:var(--s1);border-radius:var(--r-xl);padding:14px 20px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--work);width:40px;height:40px;display:grid;place-items:center;background:var(--s3);border-radius:13px}
.brand b{font-size:17px;letter-spacing:.3px}
.brand span{font-family:var(--mono);font-size:11px;color:var(--faint)}
.kpis{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.kpi{background:var(--s2);border-radius:12px;padding:6px 12px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.kpi b{display:block;font-size:17px;color:var(--text);font-family:var(--sans)}
.kpi.warn b{color:var(--gate)} .kpi.bad b{color:var(--fail)} .kpi.ok b{color:var(--pass)}
.btn{background:var(--s3);color:var(--dim);font-size:12.5px;padding:6px 13px;border-radius:var(--r-pill);white-space:nowrap}
.btn:hover{filter:brightness(1.2)}
.btn.pri{background:var(--work);color:#0c1418;font-weight:600}
.btn.danger{color:var(--fail)}
.btn[disabled]{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{background:var(--s1);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:9px;border:1px solid transparent}
.card.attn{border-color:rgba(255,217,138,.45)}
.card.halt{border-color:rgba(255,178,187,.45)}
.card .h{display:flex;align-items:baseline;gap:8px;min-width:0}
.card .h a{font-weight:700;font-size:16px;text-decoration:none}
.card .h a:hover{color:var(--work)}
.card .ver{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.card .path{font-family:var(--mono);font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-family:var(--mono);font-size:10.5px;padding:2px 9px;border-radius:var(--r-pill);background:var(--s3);color:var(--dim);white-space:nowrap}
.pill.run{background:rgba(142,224,170,.14);color:var(--pass)}
.pill.halt{background:rgba(255,178,187,.14);color:var(--fail)}
.pill.attn{background:rgba(255,217,138,.14);color:var(--gate)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:6px;background:var(--s3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pass)}
.prog{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
.rows{font-family:var(--mono);font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
.rows .w{color:var(--work)}
.rows .acc{color:var(--you)}
.err{font-family:var(--mono);font-size:11.5px;color:var(--fail);white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--s1);border-radius:var(--r-lg);padding:14px 16px}
.panel h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.acct{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.acct:last-child{border-bottom:0}
.acct .n{color:var(--text)} .acct .s{color:var(--dim);text-align:right}
.acct .s.cool{color:var(--gate)}
.feed{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ev{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;gap:7px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.ev .t{color:var(--faint);flex:0 0 auto}
.ev .p{color:var(--work);flex:0 0 auto}
.ev.good .x{color:var(--pass)} .ev.bad .x{color:var(--fail)} .ev.ask .x{color:var(--gate)}
.ev .x{word-break:break-word;min-width:0}
.add{display:flex;gap:6px;flex-wrap:wrap}
.add input{flex:1;min-width:160px;background:var(--s3);color:var(--text);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px 10px;font-family:var(--mono);font-size:12px}
.msg{font-family:var(--mono);font-size:11.5px;margin-top:8px;white-space:pre-wrap;color:var(--dim)}
.msg.bad{color:var(--fail)} .msg.ok{color:var(--pass)}
.empty{color:var(--dim);font-size:13.5px;background:var(--s1);border-radius:var(--r-lg);padding:20px}
.empty code,.panel code{font-family:var(--mono);color:#a9e6f6;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="application/json" id="dlm-data">__DATA__</script>
<script>
(function(){
'use strict';
var TOKEN = "__TOKEN__";
var LIVE = __LIVE__;
var data = JSON.parse(document.getElementById('dlm-data').textContent);
var feed = [];
var ui = { msg:null, busy:{}, addPath:'', notify:false, lastAwait:null };
try { ui.notify = localStorage.getItem('dlm-hub-notify') === '1'; } catch (e) {}

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    var v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'text') e.textContent = v; else if (k === 'cls') e.className = v; else if (k === 'style') e.style.cssText = v;
    else if (k.slice(0,2) === 'on') e[k] = v; else e.setAttribute(k, v);
  }
  (kids || []).forEach(function(c){ if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(function(x){ if (x) e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); }); else e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function money(x){ return '$' + (x || 0).toFixed(2); }
function ago(ts){
  if (!ts) return '—';
  var s = Math.max(0, (Date.now() - Date.parse(ts)) / 1000);
  return s < 60 ? Math.round(s) + ' 秒前' : s < 3600 ? Math.round(s / 60) + ' 分鐘前' : s < 86400 ? Math.round(s / 3600) + ' 小時前' : Math.round(s / 86400) + ' 天前';
}
function hhmm(ts){ var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

function api(method, path, body){
  return fetch(path, { method:method, headers:Object.assign({ authorization:'Bearer ' + TOKEN }, body ? { 'content-type':'application/json' } : {}), body: body ? JSON.stringify(body) : undefined })
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error ? j.error.message : ('HTTP ' + r.status)); return j; }); });
}
function refresh(){
  return api('GET', '/api/v1/overview').then(function(o){ data = o; checkNotify(); render(); }).catch(function(e){ ui.msg = { ok:false, text:'讀總覽失敗:' + e.message }; render(); });
}
function act(key, method, path, body, okText){
  ui.busy[key] = true; render();
  api(method, path, body).then(function(j){ ui.msg = { ok:true, text: typeof okText === 'function' ? okText(j) : okText }; })
    .catch(function(e){ ui.msg = { ok:false, text:e.message }; })
    .then(function(){ delete ui.busy[key]; return refresh(); });
}

function awaitingTotal(){ return data.totals ? data.totals.awaiting_user : 0; }
function checkNotify(){
  var n = awaitingTotal();
  if (ui.lastAwait != null && n > ui.lastAwait && ui.notify && window.Notification && Notification.permission === 'granted') {
    try { new Notification('dlm:有事等你決定', { body: n + ' 件等你(' + data.projects.filter(function(p){ return p.awaiting_user && (p.awaiting_user.decisions + p.awaiting_user.e2e); }).map(function(p){ return p.name; }).join('、') + ')' }); } catch (e) {}
  }
  ui.lastAwait = n;
  document.title = (n ? '(' + n + ') ' : '') + 'dlm hub';
}

function header(){
  var t = data.totals || { projects:0, loops_running:0, workers:0, review:0, awaiting_user:0, blocked:0, done:0, nodes:0, today_usd:0, errors:0 };
  var k = function(label, v, cls){ return el('div', { cls:'kpi' + (cls ? ' ' + cls : '') }, [label, el('b', { text:String(v) })]); };
  return el('div', { cls:'top' }, [
    el('div', { cls:'brand' }, [el('div', { cls:'logo', text:'dlm' }), el('div', {}, [el('b', { text:'dlm hub' }), el('br'), el('span', { text:'v' + (data.version || '') + ' · 這台電腦的所有專案' })])]),
    el('div', { cls:'kpis' }, [
      k('專案', t.projects), k('迴圈在跑', t.loops_running, t.loops_running ? 'ok' : ''), k('施工中', t.workers), k('審核中', t.review),
      k('等你', t.awaiting_user, t.awaiting_user ? 'warn' : ''), k('卡住', t.blocked, t.blocked ? 'bad' : ''), k('節點完成', t.done + '/' + t.nodes), k('今天', money(t.today_usd))
    ]),
    el('button', { cls:'btn', text: ui.notify ? '通知:開' : '開啟通知', onclick:function(){
      if (!window.Notification) { ui.msg = { ok:false, text:'這個瀏覽器不支援通知' }; render(); return; }
      if (ui.notify) { ui.notify = false; } else { Notification.requestPermission().then(function(p){ ui.notify = p === 'granted'; try { localStorage.setItem('dlm-hub-notify', ui.notify ? '1' : '0'); } catch (e) {} render(); }); return; }
      try { localStorage.setItem('dlm-hub-notify', '0'); } catch (e) {}
      render();
    } }),
    el('a', { cls:'btn', href:'/api/v1/openapi.json', target:'_blank', text:'API 規格' })
  ]);
}

function upgradeBtn(p, base){
  return el('button', { cls:'btn pri', disabled: ui.busy['up' + p.name] ? 'disabled' : null, text:'升級這個專案的 dlm', onclick:function(){
    if (!confirm('把 ' + p.name + ' 的 dlm 升級成 ' + data.version + '?(衝突就一個都不寫)')) return;
    act('up' + p.name, 'POST', base + '/upgrade', {}, function(j){
      return p.name + ':' + j.from + ' → ' + j.to + (j.migrated && j.migrated.length ? ',dp → dlm 改名完成' : '') + ',更新 ' + j.update.length + ' 個檔';
    });
  } });
}

function card(p){
  var enc = encodeURIComponent(p.name), base = '/api/v1/projects/' + enc;
  if (p.error) {
    return el('div', { cls:'card halt' }, [
      el('div', { cls:'h' }, [el('b', { text:p.name }), el('span', { cls:'ver', text:p.version ? 'v' + p.version : '' })]),
      el('div', { cls:'path', text:p.path }),
      el('div', { cls:'err', text:p.error }),
      el('div', { cls:'acts' }, [
        /4\.7 以上/.test(p.error) || p.legacy ? upgradeBtn(p, base) : null,
        el('button', { cls:'btn danger', text:'從清單拿掉', onclick:function(){ if (confirm('從清單拿掉 ' + p.name + '?(不刪檔案)')) act('rm' + p.name, 'DELETE', base, null, '已拿掉 ' + p.name); } })
      ])
    ]);
  }
  var a = p.awaiting_user, waiting = a.decisions + a.e2e;
  var pct = p.counts.nodes ? Math.round(100 * p.counts.done / p.counts.nodes) : 0;
  var rows = [];
  p.in_progress.forEach(function(d){ rows.push(el('div', {}, [el('span', { cls:'w', text:'▶ ' + d.id }), ' ' + d.leg + ' · ' + d.age_min + ' 分', d.account ? el('span', { cls:'acc', text:' · ' + d.account }) : null])); });
  p.review.forEach(function(d){ rows.push(el('div', { text:'◎ ' + d.id + ' 驗收中' })); });
  p.blocked.forEach(function(d){ rows.push(el('div', { style:'color:var(--fail)', text:'✗ ' + d.id + ' 卡住' })); });
  if (!rows.length) rows.push(el('div', { style:'color:var(--faint)', text: p.dispatchable ? p.dispatchable + ' 個節點可派' : (p.counts.done === p.counts.nodes && p.counts.nodes ? '全部完成' : '沒有在做的事') }));
  var running = p.loop && p.loop.running;
  return el('div', { cls:'card' + (p.halted ? ' halt' : waiting ? ' attn' : '') }, [
    el('div', { cls:'h' }, [el('a', { href:'/p/' + enc + '/', text:p.name }), el('span', { cls:'ver', text:'v' + p.version + (p.mode === 'brownfield' ? ' · 既有專案' : '') })]),
    el('div', { cls:'path', title:p.path, text:p.path }),
    el('div', { cls:'pills' }, [
      p.halted ? el('span', { cls:'pill halt', text:'停機中' }) : null,
      el('span', { cls:'pill' + (running ? ' run' : ''), text: running ? (p.loop.stopping ? '迴圈結束中' : '迴圈執行中') : '迴圈沒跑' }),
      waiting ? el('span', { cls:'pill attn', text:'等你 ' + waiting + ' 件' }) : null,
      el('span', { cls:'pill', text:'今天 ' + money(p.budget.today_usd) + ' / ' + money(p.budget.daily_usd) })
    ]),
    p.halted ? el('div', { cls:'err', text:String(p.halted) }) : null,
    el('div', {}, [el('div', { cls:'prog' }, [el('span', { text:'完成 ' + p.counts.done + ' / ' + p.counts.nodes }), el('span', { text:ago(p.last_event_ts) })]), el('div', { cls:'bar' }, [el('i', { style:'width:' + pct + '%' })])]),
    el('div', { cls:'rows' }, rows),
    (p.warnings || []).length ? el('div', { cls:'rows', style:'color:var(--gate)' }, p.warnings.slice(0, 2).map(function(w){ return el('div', { text:'⚠ ' + w }); })) : null,
    p.legacy ? el('div', { cls:'rows', style:'color:var(--gate)' }, [el('div', { text:'⚠ 4.8.0 以前(dp)的專案:升級後改用 dlm 的檔名。先停迴圈再升級' })]) : null,
    el('div', { cls:'acts' }, [
      p.legacy && !running ? upgradeBtn(p, base) : null,
      el('a', { cls:'btn' + (p.legacy && !running ? '' : ' pri'), href:'/p/' + enc + '/', style:'text-decoration:none', text:'開主控台' }),
      running ? el('button', { cls:'btn', disabled: ui.busy['loop' + p.name] || p.loop.stopping ? 'disabled' : null, text:'停止迴圈', onclick:function(){
        act('loop' + p.name, 'POST', base + '/loop/stop', { wait:0 }, p.name + ':已要求背景迴圈這一輪做完就結束');
      } }) : el('button', { cls:'btn', disabled: ui.busy['loop' + p.name] ? 'disabled' : null, text:'啟動迴圈', onclick:function(){
        act('loop' + p.name, 'POST', base + '/loop/start', { interval:60 }, function(j){ return p.name + ':背景迴圈已啟動(pid ' + j.pid + ')'; });
      } }),
      p.halted ? el('button', { cls:'btn', text:'恢復', onclick:function(){
        var v = prompt('恢復 ' + p.name + '。照抄你的原話(會記進帳本):', '繼續');
        if (v) act('res' + p.name, 'POST', base + '/resume', { verbatim:v }, p.name + ':已恢復');
      } }) : el('button', { cls:'btn danger', text:'停機', onclick:function(){
        var v = prompt('停機 ' + p.name + ':不再派工並終止還在跑的 worker。理由(你的原話):', '先停一下');
        if (v) act('halt' + p.name, 'POST', base + '/halt', { reason:v }, function(j){ return p.name + ':已停機' + (j.stopped && j.stopped.length ? ',終止 ' + j.stopped.join(', ') : ''); });
      } })
    ])
  ]);
}

function accounts(){
  var list = data.accounts || [];
  var p = el('div', { cls:'panel' }, [el('h3', { text:'訂閱帳號 · 所有專案加起來' })]);
  if (!list.length) p.appendChild(el('div', { style:'color:var(--dim);font-size:13px' }, ['還沒登記。終端機:', el('code', { text:'dlm account add max-a --cli claude' })]));
  list.forEach(function(a){
    var cool = a.limited_until && Date.parse(a.limited_until) > Date.now();
    p.appendChild(el('div', { cls:'acct' }, [
      el('span', { cls:'n', text:a.name + ' ' }, [el('span', { style:'color:var(--faint)', text:a.cli + (a.plan ? '·' + a.plan : '') })]),
      el('span', { cls:'s' + (cool ? ' cool' : ''), text: (cool ? '冷卻到 ' + hhmm(a.limited_until) + ' · ' : '') + '跑 ' + a.open + (a.max_parallel ? '/' + a.max_parallel : '') + ' · 5h ' + a.dispatches_5h + ' 次 · ' + money(a.usd_7d) + '/7d' })
    ]));
  });
  return p;
}

var EV = {
  dispatch:function(e){ return ['派工 ' + e.node_id + ' ' + e.leg + (e.account ? '(' + e.account + ')' : ''), '']; },
  worker_done:function(e){ return ['交件 ' + e.dispatch_id, '']; },
  worker_failed:function(e){ return ['失敗 ' + e.dispatch_id + ':' + (e.reason || '').slice(0, 80), 'bad']; },
  worker_blocked:function(e){ return ['卡住 ' + e.dispatch_id, 'bad']; },
  accept:function(e){ return ['合併 ' + (e.node_id || e.dispatch_id || ''), 'good']; },
  leg_done:function(e){ return ['完成一棒 ' + (e.node_id || ''), 'good']; },
  reject:function(e){ return ['退回 ' + (e.node_id || e.dispatch_id || ''), 'bad']; },
  decision_request:function(e){ return ['等你決定 ' + e.ref, 'ask']; },
  decision:function(e){ return ['決定 ' + e.ref + ' = ' + e.choice, '']; },
  e2e_request:function(e){ return ['請你試用 ' + (e.node_id || ''), 'ask']; },
  e2e_confirm:function(e){ return ['試用 ' + (e.node_id || '') + (e.ok ? ' 通過' : ' 不行'), e.ok ? 'good' : 'bad']; },
  unblock:function(e){ return ['解除封鎖 ' + (e.node_id || ''), '']; },
  leg_reopen:function(e){ return ['退回測試棒 ' + (e.node_id || ''), 'bad']; },
  halt:function(e){ return ['停機:' + (e.reason || '').slice(0, 60), 'bad']; },
  resume:function(){ return ['恢復', 'good']; },
  node_added:function(e){ return ['加入節點 ' + (e.node_id || e.id || ''), '']; },
  block:function(e){ return ['封鎖 ' + (e.node_id || ''), 'bad']; },
  critic:function(e){ return ['Critic ' + (e.verdict || ''), '']; }
};
function feedPanel(){
  var f = el('div', { cls:'feed' }, feed.length ? feed.slice().reverse().map(function(x){
    return el('div', { cls:'ev ' + x.cls }, [el('span', { cls:'t', text:hhmm(x.ts) }), el('span', { cls:'p', text:x.project }), el('span', { cls:'x', text:x.text })]);
  }) : [el('div', { style:'color:var(--faint);font-size:12px', text:'還沒有事件。所有專案的新事件會即時出現在這裡。' })]);
  return el('div', { cls:'panel' }, [el('h3', { text:'即時動態' }), f]);
}

function addPanel(){
  var inp = el('input', { placeholder:'/絕對路徑/到/dlm 專案', value:ui.addPath, oninput:function(){ ui.addPath = this.value; } });
  return el('div', { cls:'panel' }, [
    el('h3', { text:'加入專案' }),
    el('div', { cls:'add' }, [inp, el('button', { cls:'btn pri', text:'登記', onclick:function(){
      var path = ui.addPath.trim(); if (!path) return;
      act('add', 'POST', '/api/v1/projects', { path:path }, function(j){ ui.addPath = ''; return j.existed ? '已經登記過了(' + j.name + ')' : '已登記 ' + j.name; });
    } })]),
    el('div', { style:'color:var(--faint);font-size:12px;margin-top:8px' }, ['還不是 dlm 專案的目錄,先用 MCP 的 ', el('code', { text:'dlm_init_project' }), ' 或終端機 ', el('code', { text:'dlm init' }), '。'])
  ]);
}

function render(){
  var app = document.getElementById('app');
  var focused = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (focused) return; // 打字中不重畫
  app.textContent = '';
  app.appendChild(header());
  var left = el('div', {}, []);
  if (ui.msg) left.appendChild(el('div', { cls:'msg ' + (ui.msg.ok ? 'ok' : 'bad'), style:'margin:0 0 10px', text:ui.msg.text }));
  if (data.loading) left.appendChild(el('div', { cls:'empty', text:'讀取中…' }));
  else if (!data.projects.length) left.appendChild(el('div', { cls:'empty' }, ['還沒有登記任何專案。右邊貼上專案路徑登記,或在終端機跑 ', el('code', { text:'dlm project add <目錄>' }), '。']));
  else {
    var order = data.projects.slice().sort(function(a, b){
      var w = function(p){ return p.error ? 0 : p.halted ? 1 : (p.awaiting_user.decisions + p.awaiting_user.e2e) ? 2 : p.in_progress.length ? 3 : 4; };
      return w(a) - w(b) || a.name.localeCompare(b.name);
    });
    left.appendChild(el('div', { cls:'cards' }, order.map(card)));
  }
  app.appendChild(el('div', { cls:'grid' }, [left, el('div', { cls:'side' }, [accounts(), feedPanel(), addPanel()])]));
}

render();
if (data.loading) refresh();
setInterval(refresh, LIVE || 5000);
if (window.EventSource) {
  var seen = {};
  var es = new EventSource('/api/v1/events/stream?recent=30&token=' + encodeURIComponent(TOKEN));
  es.addEventListener('ledger', function(m){
    try {
      var d = JSON.parse(m.data), f = EV[d.event.type], key = d.project + ':' + d.event.seq;
      if (!f || seen[key]) return; // 斷線重連時會再補一次最近的,略過看過的
      seen[key] = 1;
      var x = f(d.event);
      feed.push({ ts:d.event.ts, project:d.project, text:x[0], cls:x[1] });
      if (feed.length > 200) feed.shift();
      render();
    } catch (e) {}
  });
}
})();
</script>
</body>
</html>
