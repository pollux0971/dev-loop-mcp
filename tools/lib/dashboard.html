<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* dp 主控台:唯讀。資料全部來自帳本重播(跟 dp status 同一份);不連任何外部資源。 */
:root{
  --bg:#121216; --s1:#1a1a1f; --s2:#202026; --s3:#27272e; --s4:#30303a;
  --line:rgba(255,255,255,.09);
  --text:#e6e3ec; --dim:#a8a4b2; --faint:#76727f;
  --orch:#ffce86; --work:#7fd4ec; --fix:#f5a6c1; --ver:#a9d9c6; --you:#cdb4ff;
  --pass:#8ee0aa; --fail:#ffb2bb; --gate:#ffd98a; --sys:#aec3ca;
  --sans:'Outfit','Noto Sans TC','PingFang TC',system-ui,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  --r-xl:24px; --r-lg:18px; --r-pill:999px;
  --e1:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.28); --e2:0 3px 8px rgba(0,0,0,.42); --e3:0 10px 30px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55;overflow:hidden;
  background-image:radial-gradient(1100px 520px at 78% -15%,rgba(127,212,236,.06),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--work);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--s4);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:64px 1fr;height:100vh;padding:10px;gap:10px;transition:grid-template-columns .26s cubic-bezier(.2,0,0,1)}
.app.rail-open{grid-template-columns:208px 1fr}
.rail{display:flex;flex-direction:column;gap:4px;background:var(--s1);border-radius:var(--r-xl);padding:12px 8px;box-shadow:var(--e1);overflow:hidden}
.rail .top{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding:0 4px}
.rail .logo{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--work);width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;background:var(--s3);border-radius:13px;cursor:pointer}
.rail .wordmark{font-weight:700;letter-spacing:0;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .2s}
.app.rail-open .wordmark{opacity:1}
.rail button.nav{display:flex;align-items:center;gap:12px;width:100%;padding:5px 4px;border-radius:14px;color:var(--dim);white-space:nowrap}
.rail button.nav .ic{width:40px;height:32px;flex:0 0 40px;display:grid;place-items:center;border-radius:var(--r-pill);font-size:16px;transition:background .15s}
.rail button.nav:hover .ic{background:var(--s3)}
.rail button.nav .lb{font-size:13.5px;opacity:0;transition:opacity .2s}
.app.rail-open button.nav .lb{opacity:1}
.rail button.nav.on{color:var(--text)}
.rail button.nav.on .ic{background:rgba(127,212,236,.18);color:var(--work)}
.rail .grow{flex:1}
.rail .foot{font-family:var(--mono);font-size:9.5px;color:var(--faint);display:flex;align-items:center;gap:9px;padding:6px 4px;white-space:nowrap}
.rail .foot .fx{width:40px;flex:0 0 40px;display:grid;place-items:center}
.rail .foot .fl{opacity:0;transition:opacity .2s}
.app.rail-open .foot .fl{opacity:1}

.main{display:flex;flex-direction:column;min-width:0;background:var(--s1);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--e2)}
.header{display:flex;align-items:center;gap:16px;padding:13px 20px;background:var(--s2);flex:0 0 auto}
.story{display:flex;flex-direction:column;min-width:0}
.story .sid{font-family:var(--mono);font-size:12.5px;color:var(--work);display:flex;align-items:center;gap:8px}
.story .obj{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.hgrow{flex:1}
.stat{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right;line-height:1.45;white-space:nowrap}
.stat b{color:var(--text);font-size:13px}
.stat .leg{letter-spacing:.6px;text-transform:uppercase}
.mode{display:flex;background:var(--s3);border-radius:var(--r-pill);padding:3px;font-family:var(--mono);font-size:12px;flex:0 0 auto}
.mode button{padding:6px 13px;border-radius:var(--r-pill);color:var(--dim);letter-spacing:.4px;transition:.15s;white-space:nowrap}
.mode button.on{background:var(--s4);color:var(--text)}
.mode button:disabled{opacity:.35;cursor:default}
.pmode button:disabled{opacity:1;cursor:default} .pmode button:disabled:not(.on){opacity:.4}
.pmode button.on.bf{background:rgba(255,217,138,.16);color:var(--gate)}
.bf-banner{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 12px;padding:9px 14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--s2);font-family:var(--mono);font-size:12px;color:var(--dim)}
.bf-banner .k{color:var(--gate);font-weight:600} .bf-banner .ok{color:var(--pass)} .bf-banner .warn{color:var(--gate)}
.chip.pin{border-color:rgba(255,217,138,.4);color:var(--gate)} .chip.pin-skip{color:var(--dim)}

.topbar{display:flex;align-items:center;gap:12px;padding:7px 16px;background:var(--s2);border-top:1px solid var(--s3);font-size:12px;flex-shrink:0;flex-wrap:wrap}
.topbar .lbl{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.5px}
.lamps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lamp{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);background:var(--s3);font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.lamp .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex-shrink:0}
.lamp.active{color:var(--gate)} .lamp.active .dot{background:var(--gate);animation:breathe 1.3s ease-in-out infinite}
.lamp.done{color:var(--pass)} .lamp.done .dot{background:var(--pass)}
.lamp.wait{color:var(--fix)} .lamp.wait .dot{background:var(--fix)}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.costbar{margin-left:auto;display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px}
.costbar .track{width:120px;height:7px;border-radius:4px;background:var(--s3);overflow:hidden}
.costbar .fill{height:100%;background:linear-gradient(90deg,var(--pass),var(--gate));transition:width .4s}
.costbar .fill.warn{background:linear-gradient(90deg,var(--gate),var(--fail))}
.costbar .amt{color:var(--dim)} .costbar .cap{color:var(--faint)}

.page{display:none;flex:1;min-height:0;flex-direction:column}
.page.on{display:flex}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.1fr 1fr 200px;gap:10px;padding:10px}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border-radius:20px;overflow:hidden}
.pane-head{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--s2);min-height:47px}
.av{width:25px;height:25px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;color:#16131a;flex:0 0 25px}
.p-orch .av{background:var(--orch)} .p-ver .av{background:var(--ver)} .p-spine .av{background:var(--sys)}
.pane-head .nm{font-weight:600;font-size:14.5px;white-space:nowrap}
.p-orch .nm{color:var(--orch)} .p-ver .nm{color:var(--ver)} .p-spine .nm{color:var(--sys)}
.pane-head .sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 8px}
.dot.live{background:var(--work);box-shadow:0 0 8px var(--work);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.p-spine{background:linear-gradient(180deg,rgba(174,195,202,.06),var(--bg))}

.tabs{display:flex;gap:2px;margin-left:2px;margin-bottom:-11px;align-self:flex-end}
.tabs button{font-family:var(--mono);font-size:12.5px;padding:7px 13px 9px;border-radius:12px 12px 0 0;color:var(--faint);position:relative;letter-spacing:.3px}
.tabs button.on{color:var(--text);background:var(--bg);box-shadow:inset 0 2px 0 var(--work)}
.tabs button.t-fix.on{box-shadow:inset 0 2px 0 var(--fix)}
.tabs button .blink{position:absolute;top:7px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--fix);box-shadow:0 0 6px var(--fix);animation:pulse 1.2s infinite}

.stream{flex:1;overflow-y:auto;padding:12px 14px;font-family:var(--mono);font-size:12.4px;line-height:1.7;min-height:0}
.ln{display:block;white-space:pre-wrap;word-break:break-word;margin:2px 0}
.ln .who{font-weight:600;margin-right:8px}
.w-orch{color:var(--orch)} .w-work{color:var(--work)} .w-fix{color:var(--fix)} .w-ver{color:var(--ver)} .w-you{color:var(--you)} .w-sys{color:var(--faint)} .w-crit{color:var(--ver)}
.ln .hl{color:var(--work)} .ln .ok{color:var(--pass)} .ln .bad{color:var(--fail)} .ln .warn{color:var(--gate)}
.ln.dim{color:var(--faint)}
.ln.tool{color:var(--dim)} .ln.tool .cmd{color:#a9e6f6}
.ln.sub{padding-left:18px;color:var(--dim)} .ln.sub::before{content:"↳ ";color:var(--faint);margin-left:-18px}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.empty-pane{color:var(--faint);font-size:12px;padding:6px 0}

.card{margin:6px 0 9px;background:var(--s2);border-radius:var(--r-lg);box-shadow:var(--e1);padding:11px 13px 11px 15px;font-family:var(--sans);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orch)}
.card.rep::before{background:var(--work)} .card.rep.fix::before{background:var(--fix)} .card.crit::before{background:var(--ver)} .card.bad::before{background:var(--fail)}
.card h4{font-size:11.5px;font-family:var(--mono);letter-spacing:.5px;color:var(--dim);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card h4 .r{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400}
.card .row{display:flex;gap:8px;font-size:13px;margin:4px 0}
.card .row .k{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;flex:0 0 76px;padding-top:2px;letter-spacing:.4px}
.card .row .v{flex:1;min-width:0;word-break:break-word}
.card p{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:11px;padding:2px 10px;border-radius:var(--r-pill);background:var(--s4);color:var(--dim);white-space:nowrap}
.chip.no{color:var(--fail);background:rgba(255,178,187,.12)}
.chip.more{color:var(--faint);background:transparent;border:1px dashed var(--s4);cursor:pointer}

.claim{display:flex;gap:8px;font-family:var(--mono);font-size:11.8px;line-height:1.6;margin:5px 0;color:var(--dim)}
.claim .ci{flex:0 0 14px;text-align:center}
.claim.ok .ci{color:var(--pass)} .claim.unv .ci{color:var(--gate)} .claim.bad .ci{color:var(--fail)}
.claim .ct{flex:1;min-width:0;word-break:break-word}
.claim .ct .t{color:var(--text);font-family:var(--sans);font-size:12.8px}
.claim .ct .cmd{color:#a9e6f6}
.claim .ct .tail{display:block;color:var(--faint);white-space:pre-wrap}

.think{margin:4px 0 6px;border-radius:12px;background:rgba(174,195,202,.07);padding:8px 11px 20px;color:#bcd0c4;cursor:pointer;
  opacity:.6;max-height:5.2em;overflow:hidden;position:relative;transition:opacity .2s;font-family:var(--sans);font-size:12.8px;white-space:pre-wrap;word-break:break-word}
.think::after{content:"⌄ 展開";position:absolute;right:10px;bottom:4px;font-size:10px;color:var(--faint);background:var(--bg);padding:1px 7px;border-radius:8px}
.think:hover{opacity:.85}
.think.open{opacity:1;max-height:none}
.think.open::after{content:"⌃ 收合"}

.todo{flex:0 0 auto;border-top:1px solid var(--line);background:var(--s2);padding:9px 13px 11px;max-height:190px;overflow-y:auto}
.todo .th{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.todo .th .ct{margin-left:auto;color:var(--dim)}
.todo .ti{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:3px 0;color:var(--dim)}
.todo .ti .box{width:15px;height:15px;flex:0 0 15px;border-radius:5px;border:1.6px solid var(--faint);display:grid;place-items:center;font-size:10px;color:transparent}
.todo .ti.doing .box{border-color:var(--work);box-shadow:0 0 7px rgba(127,212,236,.5)}
.todo .ti.doing{color:var(--text)}
.todo .ti.done .box{background:var(--pass);border-color:var(--pass);color:#0c1a10}
.todo .ti.done{color:var(--faint)}
.todo .ti.done .tt{text-decoration:line-through}
.todo .ti.fail .box{border-color:var(--fail);color:var(--fail)}
.todo .ti .tt{flex:1}
.todo .ti .tm{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

.vrow{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-family:var(--mono);font-size:11.5px;margin:4px 0}
.vrow .ck{color:var(--dim);flex:0 0 auto}
.vrow .dt{color:var(--faint);flex:1 1 100%;min-width:0;word-break:break-word;font-size:11px;padding-left:4px}
.vrow .dt:empty{display:none}
.out{font-family:var(--mono);font-size:9.5px;padding:1px 7px;border-radius:var(--r-pill);flex:0 0 auto;letter-spacing:.3px}
.out.PASS,.out.NO_OBJECTION{background:rgba(142,224,170,.14);color:var(--pass)}
.out.FAIL{background:rgba(255,178,187,.14);color:var(--fail)}
.out.ABSTAIN{background:rgba(255,217,138,.12);color:var(--gate)}
.out.SKIPPED{background:var(--s3);color:var(--faint)}
.stamp{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:3px 10px;border-radius:var(--r-pill)}
.stamp.pass{background:rgba(142,224,170,.15);color:var(--pass)}
.stamp.fail{background:rgba(255,107,107,.15);color:var(--fail)}
.stamp.ask{background:rgba(255,217,138,.13);color:var(--gate)}
.stamp.pending{background:var(--s3);color:var(--faint)}
.vblock{border-bottom:1px solid rgba(255,255,255,.05);padding:6px 0 8px}

.spine-stream{flex:1;overflow-y:auto;padding:10px 11px;font-family:var(--mono);font-size:11.3px;line-height:1.65;min-height:0}
.sp{display:flex;gap:7px;padding:6px 0;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.04)}
.playing .stream > :last-child,.playing .spine-stream > :last-child{animation:rise .3s ease}
.sp .ico{flex:0 0 14px;text-align:center}
.sp .tx{flex:1;word-break:break-word}
.sp .tx b{color:var(--sys);font-weight:600}
.sp.ok .ico{color:var(--pass)} .sp.bad .ico{color:var(--fail)} .sp.gate .ico{color:var(--gate)}
.sp .res{color:var(--pass)} .sp .res.bad{color:var(--fail)} .sp .res.warn{color:var(--gate)}

.ascii{font-family:var(--mono);font-size:10.8px;line-height:1.5;white-space:pre;color:var(--dim);background:var(--s1);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:8px 14px 12px;flex:0 0 auto}
.ascii .hl{color:var(--work)} .ascii .ok{color:var(--pass)} .ascii .bad{color:var(--fail)} .ascii .warn{color:var(--gate)}
.route{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:10.8px;white-space:normal}
.route th,.route td{border:1px dashed rgba(255,255,255,.14);padding:2px 8px;text-align:left;vertical-align:top}
.route th{color:var(--faint);font-weight:500}
.route td.hl{color:var(--dim)} .route tr.cur td.hl{color:var(--work);font-weight:600}
.route tr:not(:first-child){cursor:pointer} .route tr:not(:first-child):hover td{background:var(--s2)}
.ascii-h{font-family:var(--mono);font-size:10.5px;color:var(--orch);padding:0 14px;flex:0 0 auto}
.ascii-h span{color:var(--faint)}

.inputbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--s2)}
.owner{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.4px;padding:7px 13px;border-radius:var(--r-pill);background:rgba(142,224,170,.12);color:var(--pass);white-space:nowrap}
.owner .odot{width:7px;height:7px;border-radius:50%;background:currentColor}
.owner.ask{background:rgba(255,217,138,.14);color:var(--gate)}
.owner.ask .odot{animation:pulse 1.4s infinite}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--s3);border-radius:var(--r-pill);padding:4px 6px 4px 18px}
.field .q{flex:1;min-width:0;font-size:13px;color:var(--dim);padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .q code{font-family:var(--mono);color:#a9e6f6;font-size:12.5px}
.send{background:var(--work);color:#0c1418;font-weight:600;font-size:13px;padding:8px 16px;border-radius:var(--r-pill);white-space:nowrap}
.send:hover{filter:brightness(1.1)}
.send.ghost{background:var(--s4);color:var(--dim)}

.acct-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acct-form input,.acct-form select{background:var(--s3);color:var(--text);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:12px;min-width:0}
.acct-form input{width:140px}
.acct-role{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.acct-role:last-child{border-bottom:0}
.acct-role .rn{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--work)}
.acct-chk{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;color:var(--dim);margin-right:12px;cursor:pointer}
.acct-msg{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;padding:8px 12px;border-radius:8px;background:var(--s2);color:var(--dim);margin-bottom:14px}
.acct-msg.bad{color:var(--fail)} .acct-msg.ok{color:var(--pass)}
.acct-note{font-size:12px;color:var(--faint)}
.acct-note code,.route code{font-family:var(--mono);color:#a9e6f6}
.mini{font-size:11px;padding:3px 10px}
.pg-wrap{flex:1;min-height:0;overflow-y:auto;padding:22px 26px}
.pg-title{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.pg-title h2{font-size:21px;font-weight:700;letter-spacing:.2px}
.pg-title .tag{font-family:var(--mono);font-size:11px;color:var(--faint)}
.pg-sub{color:var(--dim);font-size:13.5px;margin-bottom:20px;max-width:680px}
.sect{margin-bottom:22px}
.sect h3{font-family:var(--mono);font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel{background:var(--bg);border-radius:var(--r-lg);padding:16px 18px}
.wave{display:flex;gap:7px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim);flex-wrap:wrap}
.wave .wv{padding:3px 10px;border-radius:var(--r-pill);background:var(--s3)}
.wave .wv.now{background:var(--work);color:#0a1a1f;font-weight:600}
.wave .wv.done{background:rgba(142,224,170,.14);color:var(--pass)}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lane{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;min-height:120px}
.lane h4{font-family:var(--mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;display:flex}
.lane h4 span{margin-left:auto}
.scard{background:var(--s2);border-radius:9px;padding:8px 10px;font-size:12px;cursor:pointer;border-left:3px solid var(--faint)}
.scard:hover{background:var(--s3)}
.scard .sc-id{font-family:var(--mono);font-size:11px;color:var(--work)}

.scard.run{border-left-color:var(--work)} .scard.rev{border-left-color:var(--ver)} .scard.blok{border-left-color:var(--fail)} .scard.done{border-left-color:var(--pass)}

.t-accept .tx,.t-e2e_confirm .tx{color:var(--pass)} .t-reject .tx,.t-block .tx,.t-worker_blocked .tx,.t-worker_failed .tx{color:var(--fail)} .t-decision_request .tx,.t-e2e_request .tx,.t-halt .tx{color:var(--gate)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}

/* 規劃頁:左邊是你和 Front 的規劃對話(帳本重播),右邊是路線圖進度 */
.ps-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;flex:1;min-height:0;padding:10px}

.ps-msg .opts{display:flex;flex-direction:column;gap:6px;margin-top:10px;white-space:normal}
.gopt{display:flex;align-items:center;gap:11px;text-align:left;padding:9px 13px;border-radius:12px;background:var(--s3);border:1px solid var(--line)}
.gopt.picked{border-color:var(--you);background:rgba(205,180,255,.1)}
.gopt .gk{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto}

.gopt .gr{font-family:var(--mono);font-size:10px;color:var(--you)}
.pnode{margin-top:10px;background:var(--s3);border-radius:12px;padding:9px 12px;white-space:normal}
.pnode .pid{font-family:var(--mono);font-size:11.5px;color:var(--work)}
.pnode .pid span{color:var(--faint);margin-left:6px}
.pnode .pin{font-size:12.5px;color:var(--dim);margin-top:3px}
.pnode .chips{margin-top:6px}
.gk-file{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--faint);cursor:pointer;white-space:normal}

.gk-file pre{display:none;margin-top:6px;white-space:pre-wrap;color:var(--dim);background:var(--s1);border-radius:8px;padding:9px 11px;font-size:11.2px;line-height:1.55;max-height:360px;overflow:auto}

.stepper .sh{font-family:var(--mono);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.stepper .sh .md{margin-left:auto;font-size:10.5px;padding:3px 9px;border-radius:var(--r-pill);background:rgba(205,180,255,.16);color:var(--you);text-transform:none}
.step{display:flex;gap:13px;position:relative;padding-bottom:20px;cursor:default}
.step:last-child{padding-bottom:0}
.step .sline{position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--s4)}
.step:last-child .sline{display:none}
.step .snode{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:2px solid var(--s4);background:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--faint);z-index:1}
.step .ct{padding-top:3px;min-width:0}
.step .ct .nm{font-size:13.5px;color:var(--dim);font-weight:500}
.step .ct .ds{font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.5}
.step .ct .sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.step .ct .sub span{padding:1px 7px;border-radius:var(--r-pill);background:var(--s3)}
.step .ct .sub span.ok{color:var(--pass);background:rgba(142,224,170,.1)}
.step .ct .sub span.now{color:var(--you);background:rgba(205,180,255,.14)}
.step.active .snode{border-color:var(--you);color:var(--you);box-shadow:0 0 0 5px rgba(205,180,255,.12)}
.step.active .ct .nm{color:var(--text)}
.step.done .snode{background:var(--you);border-color:var(--you);color:#1a1226}
.step.done .sline{background:var(--you)}
.step.done .ct .nm{color:var(--dim)}
.step.click{cursor:pointer}.step.click:hover .ct .nm{color:var(--text)}
@media (max-width:1180px){.panes{grid-template-columns:1fr 1fr}.p-spine{grid-column:span 2;max-height:260px}}
@media (max-width:760px){
  body{overflow:auto}
  .app{display:block;height:auto;padding:6px}
  .rail{flex-direction:row;padding:6px;margin-bottom:6px;border-radius:18px;align-items:center}
  .rail .top{margin:0}.rail .wordmark,.rail .foot,.rail .grow{display:none}
  .rail button.nav{width:auto;padding:0}.rail button.nav .lb{display:none}
  .header{flex-wrap:wrap;padding:12px 14px;gap:10px}.story .obj{max-width:none;white-space:normal}
  .stat{text-align:left}
  .panes{display:flex;flex-direction:column}
  .pane{min-height:260px;max-height:520px}.p-spine{max-height:300px}
  .lanes{grid-template-columns:1fr}
  .ps-grid{display:flex;flex-direction:column}.ps-chat{max-height:none}.ps-stream{max-height:none;overflow:visible}.ps-msg{max-width:96%}
  .pg-wrap{padding:16px}
  .inputbar{flex-wrap:wrap}.field{flex-basis:100%;border-radius:18px;flex-wrap:wrap;padding:8px 10px 8px 14px}.field .q{white-space:normal}
  .costbar{margin-left:0}
  .ask-row{flex-wrap:wrap}.ask-row .ar-ref{flex-basis:100%}
  .tl-row .ac{display:none}
}

<body>
<div class="app" id="app"></div>
<script type="application/json" id="dp-data">__DATA__</script>
<script>
(function(){
'use strict';
var LIVE = __LIVE__;
var TOKEN = "__TOKEN__";
var HUB = "__HUB__";
var data = JSON.parse(document.getElementById('dp-data').textContent);
var ui = { acct:{ form:{ name:'', cli:'claude', plan:'' }, roles:null, login:null, msg:null, busy:false }, view:'console', node:null, pinned:false, tab:null, cursor:null, playing:null, railOpen:false, tlNode:null, tlAll:false, more:{} };
// 一打開看哪一頁:有軟體在開發 → 主控台;沒有 → 規劃頁(Front · intake),跟 Front 規劃下一版。
// data.initial_view 由 dp 算(v4.7.3);舊版 dp 的專案沒有這個欄位,就用看得到的資料估。之後切頁只在這次打開有效,不記住
ui.view = data.initial_view || ((data.in_progress || []).length || (data.review || []).length || (data.blocked || []).length
  || (data.decisions || []).some(function(d){ return /^(accept|escalation|stuck|testfix|spawn):/.test(d.ref); }) ? 'console' : 'planning');
try { var saved = JSON.parse(localStorage.getItem('dp-console') || '{}'); ui.railOpen = !!saved.railOpen; } catch (e) {}
function save(){ try { localStorage.setItem('dp-console', JSON.stringify({ railOpen: ui.railOpen })); } catch (e) {} }

var STATUS = { done:'完成', 'in-progress':'施工中', review:'驗收中', todo:'未開始', blocked:'卡住', stale:'需重驗' };
var LEG = { characterize:'釘現況', test:'測試棒', dev:'實作棒', integrate:'整合棒', 'test-fix':'修測試' };
var ACTOR = { orchestrator:['orch','w-orch'], verifier:['verifier','w-ver'], critic:['critic','w-crit'], user:['你','w-you'], 'dp-cli':['dp','w-sys'] };
var QUIET = { inbox_viewed:1, launched:1, cost:1 };

/* ── helpers ─────────────────────────────── */
function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    var v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'text') e.textContent = v; else if (k === 'cls') e.className = v; else if (k === 'style') e.style.cssText = v;
    else if (k.slice(0,2) === 'on') e[k] = v; else e.setAttribute(k, v);
  }
  add(e, kids); return e;
}
function add(e, kids){ (kids || []).forEach(function(c){ if (c == null || c === false) return; if (Array.isArray(c)) add(e, c); else e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }); return e; }
function span(cls, text){ return el('span', { cls: cls, text: text }); }
function money(x){ return '$' + (x || 0).toFixed(2); }
function when(ts){ return ts ? ts.slice(5,16).replace('T',' ') : ''; }
function short(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function nodeById(id){ for (var i = 0; i < data.nodes.length; i++) if (data.nodes[i].id === id) return data.nodes[i]; return null; }
function nodeEvents(id){ return data.timeline.filter(function(e){ return e.node === id; }); }
function cursorOk(e){ return ui.cursor == null || e.seq <= ui.cursor; }
function visible(id){ return nodeEvents(id).filter(cursorOk); }
function dispatchesOf(id){ return data.dispatches.filter(function(d){ return d.node === id && cursorOk(d); }); }

function defaultNode(){
  if (data.in_progress.length) return data.in_progress[0].id;
  if (data.review.length) return data.review[0].id;
  if (data.e2e.length) return data.e2e[0].id;
  for (var i = data.timeline.length - 1; i >= 0; i--) { var e = data.timeline[i]; if (e.node && nodeById(e.node) && !QUIET[e.type]) return e.node; }
  return data.nodes.length ? data.nodes[0].id : null;
}

/* 重播:這個節點的事件一筆一筆出現 */
function play(){
  var evs = nodeEvents(ui.node);
  if (!evs.length) return;
  stop();
  var i = 0; ui.cursor = evs[0].seq; ui.tab = null; render();
  ui.playing = setInterval(function(){
    i++;
    if (i >= evs.length) { stop(); ui.cursor = null; render(); return; }
    ui.cursor = evs[i].seq; ui.tab = null; render();
  }, 650);
}
function stop(){ if (ui.playing) clearInterval(ui.playing); ui.playing = null; }

/* ── 版面 ─────────────────────────────── */
function render(){
  if (!ui.node || !nodeById(ui.node)) ui.node = defaultNode();
  var app = document.getElementById('app');
  app.className = 'app' + (ui.railOpen ? ' rail-open' : '') + (ui.playing ? ' playing' : '');
  app.textContent = '';
  app.appendChild(rail());
  var main = el('div', { cls:'main' });
  app.appendChild(main);
  if (ui.view === 'console') renderConsole(main);
  else if (ui.view === 'planning') renderPlanning(main);
  else if (ui.view === 'pipeline') renderPipeline(main);
  else if (ui.view === 'timeline') renderTimeline(main);
  else if (ui.view === 'accounts') renderAccounts(main);
  else renderCost(main);
  main.appendChild(inputbar());
  Array.prototype.forEach.call(document.querySelectorAll('[data-autoscroll]'), function(s){ s.scrollTop = s.scrollHeight; });
}

function rail(){
  var waiting = data.decisions.length + data.e2e.length;
  var navs = [['console','▣','主控台'],['planning','✎','規劃'],['pipeline','▦','管線'],['timeline','≡','時間軸'],['cost','$','花費'],['accounts','◎','帳號']];
  return el('nav', { cls:'rail' }, [
    el('div', { cls:'top' }, [
      el('div', { cls:'logo', title:'展開 / 收起', onclick:function(){ ui.railOpen = !ui.railOpen; save(); render(); }, text:'dp' }),
      span('wordmark', 'dev-paradigm-mcp')
    ]),
    HUB ? el('button', { cls:'nav', title:'所有專案(dp hub)', onclick:function(){ location.href = HUB; } }, [span('ic', '⌂'), span('lb', '所有專案')]) : null,
    navs.map(function(n){
      return el('button', { cls:'nav' + (ui.view === n[0] ? ' on' : ''), title:n[2], onclick:function(){ ui.view = n[0]; save(); render(); } }, [
        span('ic', n[1]), span('lb', n[2] + (n[0] === 'pipeline' && waiting ? ' · ' + waiting : ''))
      ]);
    }),
    el('div', { cls:'grow' }),
    el('div', { cls:'foot' }, [
      el('span', { cls:'fx' }, [el('span', { cls:'dot' + (LIVE && !data.halted ? ' live' : '') })]),
      span('fl', LIVE ? (data.halted ? '停機中' : '即時 · 每 ' + LIVE / 1000 + 's') : '快照 ' + when(data.generated_at))
    ])
  ]);
}

function topbar(n){
  var evs = visible(n.id), last = evs[evs.length - 1];
  var roles = [['你',['user']],['Orchestrator',['orchestrator']],['Worker',[]],['Verifier',['verifier']],['Critic',['critic']]];
  var openDispatch = data.in_progress.concat(data.review).some(function(x){ return x.id === n.id && x.dispatch; });
  var lamps = roles.map(function(r){
    var acted = r[0] === 'Worker' ? evs.some(function(e){ return e.type === 'worker_done' || e.type === 'worker_blocked'; }) : evs.some(function(e){ return r[1].indexOf(e.actor) >= 0; });
    var active = false;
    if (last) {
      if (r[0] === 'Worker') active = (ui.cursor == null && openDispatch && n.status === 'in-progress') || (ui.cursor != null && (last.type === 'dispatch' || last.type === 'launched' || last.type === 'worker_done'));
      else active = r[1].indexOf(last.actor) >= 0 && last.type !== 'launched';
    }
    var waitYou = r[0] === '你' && (data.e2e.some(function(x){ return x.id === n.id; }) || data.decisions.length);
    return el('span', { cls:'lamp' + (active ? ' active' : waitYou && ui.cursor == null ? ' wait' : acted ? ' done' : '') }, [span('dot'), r[0]]);
  });
  var b = data.budget || {}, pct = b.daily_usd ? Math.min(100, 100 * (b.today_usd || 0) / b.daily_usd) : 0;
  return el('div', { cls:'topbar' }, [
    span('lbl', 'ROLES'), el('div', { cls:'lamps' }, lamps),
    el('div', { cls:'costbar' }, [
      span('amt', '節點 ' + money(n.cost_usd) + ' · 全部 ' + money(data.cost.total_usd)),
      el('span', { cls:'track', title:'今天 ' + money(b.today_usd) + ' / 每日上限 ' + money(b.daily_usd) }, [el('span', { cls:'fill' + (pct > 80 ? ' warn' : ''), style:'display:block;width:' + Math.max(2, pct) + '%' })]),
      span('cap', '今天 ' + money(b.today_usd) + ' / ' + money(b.daily_usd))
    ])
  ]);
}

function header(n){
  var ds = dispatchesOf(n.id), cur = ds[ds.length - 1];
  var idx = data.nodes.indexOf(n);
  var legColor = cur && cur.leg === 'test-fix' ? 'var(--fix)' : 'var(--work)';
  var total = nodeEvents(n.id).length, shown = visible(n.id).length;
  return el('div', { cls:'header' }, [
    el('div', { cls:'story' }, [
      el('div', { cls:'sid' }, [n.id, span('stamp ' + stampCls(n.status), STATUS[n.status] || n.status)]),
      el('div', { cls:'obj', title:n.title, text:n.title + (n.release ? ' · ' + n.release : '') })
    ]),
    el('div', { cls:'hgrow' }),
    el('div', { cls:'stat' }, [
      'attempt ', el('b', { text: cur ? String(cur.attempt) : '0' }), '/' + ((data.caps && data.caps.attempts) || 3),
      ' · 派工 ', el('b', { text:String(ds.length) }), ' · 事件 ', el('b', { text:String(shown) }), '/' + total,
      el('br'), el('span', { cls:'leg', style:'color:' + legColor, text: cur ? (LEG[cur.leg] || cur.leg) + ' · ' + cur.leg : n.kind })
    ]),
    el('div', { cls:'mode' }, [
      el('button', { title:'上一個節點', disabled: idx <= 0 ? 'disabled' : null, onclick:function(){ stop(); ui.cursor = null; ui.node = data.nodes[idx - 1].id; ui.pinned = true; ui.tab = null; render(); }, text:'‹' }),
      el('button', { cls: ui.cursor == null ? 'on' : '', onclick:function(){ stop(); ui.cursor = null; ui.tab = null; render(); }, text: LIVE ? '即時' : '最新' }),
      el('button', { cls: ui.cursor != null ? 'on' : '', onclick:function(){ if (ui.playing) { stop(); render(); } else play(); }, text: ui.playing ? '❚❚ 暫停' : '▶ 重播' }),
      el('button', { title:'下一個節點', disabled: idx >= data.nodes.length - 1 ? 'disabled' : null, onclick:function(){ stop(); ui.cursor = null; ui.node = data.nodes[idx + 1].id; ui.pinned = true; ui.tab = null; render(); }, text:'›' })
    ])
  ]);
}
function stampCls(st){ return st === 'done' ? 'pass' : st === 'blocked' ? 'fail' : st === 'todo' ? 'pending' : 'ask'; }

/* ── 主控台:四欄 ───────────────────────── */
function renderConsole(main){
  var n = nodeById(ui.node);
  if (!n) { main.appendChild(el('div', { cls:'pg-wrap' }, [el('div', { cls:'pg-sub', text:'dag.json 還沒有任何節點。在 Front 說你想做什麼,intake 會把第一版放進來。' })])); return; }
  main.appendChild(header(n));
  main.appendChild(topbar(n));
  if (data.halted) main.appendChild(el('div', { cls:'banner', text:'停機中:' + data.halted.reason + '(在 Front 說「繼續」或 dp resume)' }));
  var page = el('div', { cls:'page on' });
  main.appendChild(page);
  page.appendChild(el('div', { cls:'panes' }, [orchPane(n), workerPane(n), verifierPane(n), spinePane(n)]));
}

function ln(whoKey, parts, cls){
  var w = ACTOR[whoKey] || [whoKey, 'w-work'];
  return el('span', { cls:'ln' + (cls ? ' ' + cls : '') }, [span('who ' + w[1], w[0]), parts]);
}

function orchPane(n){

    var tries = ds.filter(function(d){ return d.leg === l; }).length;

var TALK = { decision_request:1, decision:1, e2e_request:1, e2e_confirm:1, halt:1, resume:1, node_added:1 };
function proposalOf(ref){ var id = String(ref || '').replace(/^node:/, ''); return data.proposals.filter(function(p){ return p.id === id; })[0] || null; }
function kindOf(ref){ ref = String(ref || ''); return ref.indexOf('node:') === 0 ? 'proposal' : ref.indexOf('accept:') === 0 ? 'accept' : 'stuck'; }

function releaseState(rel){
  if (data.mode && data.mode.mode === 'brownfield' && rel === 'v0') return { st:'done', ns:[], sub:[['ok', '既有程式'], [data.mode.asis ? 'ok' : 'now', data.mode.asis ? 'AS-IS ✓' : 'AS-IS 還沒寫'], [data.mode.baseline ? 'ok' : 'now', data.mode.baseline ? '基線 ✓' : '基線還沒記']] };
  var ns = data.nodes.filter(function(n){ return rel === '(未分版)' ? !n.release : n.release === rel; });
  var pending = data.decisions.some(function(d){ var p = proposalOf(d.ref); return p && p.release === rel; });
  if (!ns.length) return { st: pending ? 'active' : '', ns: ns, sub: pending ? [['now', '提案等你批准']] : [] };
  var done = ns.filter(function(n){ return n.status === 'done'; }).length;
  var integ = ns.filter(function(n){ return n.kind === 'integration'; })[0];
  var tried = integ && integ.e2e === 'ok';
  var sub = [['ok', '已批准'], [done === ns.length ? 'ok' : 'now', '節點 ' + done + '/' + ns.length]];
  if (integ) sub.push([tried ? 'ok' : integ.e2e === 'pending' ? 'now' : '', tried ? '你試用 ✓' : integ.e2e === 'pending' ? '等你試用' : '試用']);
  return { st: done === ns.length && (!integ || tried) ? 'done' : 'active', ns: ns, sub: sub };
}

    var inp = function(key, ph){ return el('input', { placeholder:ph, value:f[key], oninput:function(){ f[key] = this.value; } }); };
    var sel = el('select', { onchange:function(){ f.cli = this.value; } }, cfg.clis.map(function(c){ return el('option', { value:c.key, selected:c.key === f.cli ? 'selected' : null, text:c.label }); }));
    p1.appendChild(el('div', { cls:'acct-form', style:'margin-top:14px' }, [
      inp('name', '名稱,例 max-a'), sel, inp('plan', '方案(選填),例 max'),
      el('button', { cls:'send mini', text:'新增帳號', disabled:ui.acct.busy ? 'disabled' : null, onclick:function(){
        acctDo({ action:'add', name:f.name.trim(), cli:f.cli, plan:f.plan.trim() }, '已新增');
        f.name = ''; f.plan = '';
      } })
    ]));
    p1.appendChild(el('div', { cls:'acct-note', style:'margin-top:8px' }, ['新增後要登入一次(會開瀏覽器,所以要在你自己的終端機跑):', el('code', { text:'node tools/dp.mjs account login <名稱>' })]));
  }
  wrap.appendChild(el('div', { cls:'sect' }, [el('h3', { text:'這台電腦的帳號' }), p1]));

  // 角色
  ui.acct.roles = ui.acct.roles || {};
  Object.keys(cfg.roles).forEach(function(r){ if (!ui.acct.roles[r]) ui.acct.roles[r] = { accounts:cfg.roles[r].accounts.slice(), model:cfg.roles[r].model || '' }; });
  var p2 = el('div', { cls:'panel' });
  Object.keys(cfg.roles).forEach(function(r){
    var cur = cfg.roles[r], ed = ui.acct.roles[r];
    var names = cfg.registry.map(function(a){ return a.name; });
    cur.accounts.forEach(function(n){ if (names.indexOf(n) < 0) names.push(n); });
    var chks = names.map(function(n){
      var on = ed.accounts.indexOf(n) >= 0, missing = !cfg.registry.some(function(a){ return a.name === n; });
      return el('label', { cls:'acct-chk' }, [
        el('input', { type:'checkbox', checked:on ? 'checked' : null, disabled:!LIVE ? 'disabled' : null, onchange:function(){
          var i = ed.accounts.indexOf(n); if (this.checked && i < 0) ed.accounts.push(n); if (!this.checked && i >= 0) ed.accounts.splice(i, 1);
          render();
        } }), (on ? (ed.accounts.indexOf(n) + 1) + '. ' : '') + n + (missing ? '(這台電腦沒有)' : '')
      ]);
    });
    var changed = ed.accounts.join(',') !== cur.accounts.join(',') || ed.model !== (cur.model || '');
    var note = cur.custom_cmd ? '這個角色有自己寫的 cmd:照你的指令跑,只帶上帳號的登入目錄。' :
      cur.accounts.length ? '用帳號那個 CLI 的預設指令。' : r === 'verifier' && cur.backend === 'none' ? '目前沒開 Verifier。' : '目前沒用帳號(照 cmd 跑)。';
    p2.appendChild(el('div', { cls:'acct-role' }, [
      el('div', {}, [span('rn', ROLE_LABEL[r] || r), ' ', span('acct-note', note)]),
      el('div', {}, names.length ? chks : [span('acct-note', '先在上面新增帳號。')]),
      el('div', { cls:'acct-form' }, [
        el('input', { placeholder:r === 'verifier' ? '模型(選填,預設 haiku)' : '模型(選填,例 sonnet、opus)', value:ed.model, disabled:!LIVE ? 'disabled' : null, oninput:function(){ ed.model = this.value; } }),
        LIVE ? el('button', { cls:'send mini' + (changed ? '' : ' ghost'), text:'儲存', disabled:ui.acct.busy ? 'disabled' : null, onclick:function(){
          acctDo({ action:'use', role:r, accounts:ed.accounts, model:ed.model.trim() }, '已儲存');
        } }) : null,
        span('acct-note', ed.accounts.length > 1 ? '照勾選順序;每一棒挑近 5 小時用得最少、沒在冷卻的,額度用完自動換下一個。' : '')
      ])
    ]));
  });
  wrap.appendChild(el('div', { cls:'sect' }, [el('h3', { text:'每個角色用哪些帳號' }), p2]));
}

render();
if (LIVE) setInterval(function(){
  if (ui.playing) return;
  // 帳號頁正在打字時不重畫(會把輸入框清掉)
  if (ui.view === 'accounts' && document.activeElement && /^(INPUT|SELECT)$/.test(document.activeElement.tagName)) return;
  fetch('data.json', { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(nd){
    if (nd.ledger_seq === data.ledger_seq && JSON.stringify(nd.in_progress) === JSON.stringify(data.in_progress)) return;
    data = nd;
    if (!ui.pinned) ui.node = null;
    if (ui.cursor == null) render();
  }).catch(function(){});
}, LIVE);
})();
</script>
</body>
</html>
